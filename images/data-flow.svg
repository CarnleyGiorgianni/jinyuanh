<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" aria-label="Data Flow Diagram">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#161d33"/>
    </linearGradient>
    <linearGradient id="flow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flow3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#flowBg)"/>

  <!-- Source nodes -->
  <g transform="translate(80, 100)">
    <rect width="120" height="40" rx="20" fill="none" stroke="#00e5ff" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#00e5ff">Input</text>
  </g>
  <g transform="translate(80, 200)">
    <rect width="120" height="40" rx="20" fill="none" stroke="#7c4dff" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#7c4dff">Process</text>
  </g>
  <g transform="translate(80, 300)">
    <rect width="120" height="40" rx="20" fill="none" stroke="#00ff88" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#00ff88">Output</text>
  </g>

  <!-- Connecting flows -->
  <path d="M 200 120 Q 400 120 600 200" fill="none" stroke="url(#flow1)" stroke-width="2"/>
  <path d="M 200 220 L 600 220" fill="none" stroke="url(#flow2)" stroke-width="2"/>
  <path d="M 200 320 Q 400 320 600 240" fill="none" stroke="url(#flow3)" stroke-width="2"/>

  <!-- Target nodes -->
  <g transform="translate(600, 180)">
    <circle r="20" fill="none" stroke="#00e5ff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#00e5ff">DSP</text>
  </g>
  <g transform="translate(720, 220)">
    <circle r="20" fill="none" stroke="#7c4dff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#7c4dff">ML</text>
  </g>
  <g transform="translate(600, 260)">
    <circle r="20" fill="none" stroke="#00ff88" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#00ff88">UI</text>
  </g>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#e6f1ff">Real-Time Data Pipeline</text>
  <text x="400" y="370" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#495670">All processing occurs locally · No cloud dependency</text>
</svg>