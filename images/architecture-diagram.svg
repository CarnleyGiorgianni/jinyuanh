<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" aria-label="Jinyuanh Architecture Diagram">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#161d33"/>
    </linearGradient>
    <linearGradient id="archAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <radialGradient id="archGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#archBg)"/>
  <ellipse cx="400" cy="300" rx="300" ry="200" fill="url(#archGlow)"/>

  <!-- Top: Cloud / API -->
  <g transform="translate(400, 80)">
    <rect x="-80" y="-30" width="160" height="60" rx="30" fill="none" stroke="#8892b0" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="0" y="5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#8892b0">App Store APIs</text>
  </g>

  <!-- Middle: App Layer -->
  <g transform="translate(400, 230)">
    <rect x="-160" y="-40" width="320" height="80" rx="12" fill="rgba(0,229,255,0.08)" stroke="url(#archAccent)" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#e6f1ff">Jinyuanh Application</text>
    <text x="0" y="12" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#8892b0">SwiftUI · Swift 5.9 · Combine</text>
    <text x="0" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#8892b0">AVFoundation · CoreML · Metal</text>
  </g>

  <!-- Bottom: Device Storage -->
  <g transform="translate(400, 380)">
    <rect x="-120" y="-30" width="240" height="60" rx="8" fill="rgba(0,255,136,0.06)" stroke="#00ff88" stroke-width="1.5"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#00ff88">On-Device Storage</text>
    <text x="0" y="15" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#8892b0">Encrypted · iOS Data Protection</text>
  </g>

  <!-- Connection lines -->
  <line x1="400" y1="110" x2="400" y2="190" stroke="url(#archAccent)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="270" x2="400" y2="350" stroke="#00ff88" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Side: User -->
  <g transform="translate(120, 300)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="0" cy="-8" r="12" fill="none" stroke="#00e5ff" stroke-width="2"/>
    <path d="M-20 20 Q-20 5 0 5 Q20 5 20 20" fill="none" stroke="#00e5ff" stroke-width="2"/>
    <text x="0" y="60" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#8892b0">USER</text>
  </g>
  <line x1="155" y1="300" x2="240" y2="230" stroke="#00e5ff" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Side: Privacy -->
  <g transform="translate(680, 300)">
    <path d="M0 -25 L20 -15 L20 15 Q20 30 0 40 Q-20 30 -20 15 L-20 -15 Z" fill="none" stroke="#7c4dff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#7c4dff">P</text>
    <text x="0" y="60" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#8892b0">PRIVACY</text>
  </g>
  <line x1="645" y1="300" x2="560" y2="230" stroke="#7c4dff" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Bottom annotations -->
  <text x="400" y="490" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#495670">No remote servers · No analytics · No tracking</text>
  <text x="400" y="510" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#495670">User data stays on device · Encrypted at rest</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#00e5ff"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#00ff88"/>
    </marker>
  </defs>
</svg>